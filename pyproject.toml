[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-platform"
version = "2.0.0"
description = "Data Quality Assurance & Evidence Integrity Platform (DQAEIP) - flag-only data quality validation platform for 33-column consumer contact datasets; technical package name retained for compatibility"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["data_quality_platform*", "runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests",
    "runtime: runtime verification tests",
    "clickhouse: ClickHouse integration tests (requires Docker)",
    "slow: slow tests",
]
