quality_thresholds:
  completeness: 0.95
  validity: 0.95
  consistency: 0.90
  uniqueness: 0.95
  accuracy: 0.90
  freshness: 0.95
  geography_quality: 0.90
  email_quality: 0.95

evidence:
  generate_manifests: true
  compute_sha256: true
  fsync_evidence: true

security:
  pii_masking_enabled: true
  restrict_output_permissions: false
  audit_access_logging: true

monitoring:
  monitoring_enabled: true
  alert_on_sla_breach: true
  alert_on_validation_failure: true
  alert_on_reconciliation_failure: true

clickhouse:
  host: localhost
  port: 8123
  user: default
  password: ""
  database: data_quality
